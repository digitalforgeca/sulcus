name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13          # Intel macOS runner
            asset: sulcus-local-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-14          # Apple Silicon runner
            asset: sulcus-local-darwin-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset: sulcus-local-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            asset: sulcus-local-linux-aarch64
            cross: true

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.asset }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux: install system deps for OpenSSL, ONNX Runtime dynamic loading
      - name: Install Linux dependencies
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      # Cross-compilation for aarch64-linux via cross
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      # Native build
      - name: Build (native)
        if: "!matrix.cross"
        run: |
          cargo build --release --target ${{ matrix.target }} -p sulcus-local
        env:
          # Ensure ONNX Runtime downloads native binaries
          ORT_STRATEGY: download

      # Cross build
      - name: Build (cross)
        if: matrix.cross
        run: |
          cross build --release --target ${{ matrix.target }} -p sulcus-local
        env:
          ORT_STRATEGY: download

      - name: Package binary
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/sulcus-local staging/
          cd staging
          tar czf ../${{ matrix.asset }}.tar.gz sulcus-local
          cd ..
          shasum -a 256 ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release-files/ \;
          echo "## SHA256 Checksums" > release-files/CHECKSUMS.md
          echo '```' >> release-files/CHECKSUMS.md
          cat release-files/*.sha256 >> release-files/CHECKSUMS.md
          echo '```' >> release-files/CHECKSUMS.md
          ls -la release-files/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Check if release exists
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets..."
            gh release upload "$TAG" release-files/*.tar.gz release-files/*.sha256 --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "Sulcus $TAG" \
              --notes-file release-files/CHECKSUMS.md \
              release-files/*.tar.gz release-files/*.sha256
          fi

  # Update Homebrew formula with new SHA256 checksums
  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    name: Update Homebrew Tap
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download checksum artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Parse checksums
        id: shas
        run: |
          for f in artifacts/**/*.sha256; do
            name=$(basename "$f" .tar.gz.sha256)
            sha=$(awk '{print $1}' "$f")
            key=$(echo "$name" | sed 's/sulcus-local-//' | tr '-' '_')
            echo "${key}=${sha}" >> $GITHUB_OUTPUT
          done

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: digitalforgeca/homebrew-sulcus
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          FORMULA="homebrew-tap/Formula/sulcus-local.rb"

          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"

          # Update SHA256 checksums (uncomment and fill)
          # darwin-arm64
          if [ -n "${{ steps.shas.outputs.darwin_arm64 }}" ]; then
            sed -i "/darwin-arm64/,/sha256/{s|# sha256 \".*\"|sha256 \"${{ steps.shas.outputs.darwin_arm64 }}\"|; s|sha256 \".*\"|sha256 \"${{ steps.shas.outputs.darwin_arm64 }}\"|}" "$FORMULA"
          fi
          # darwin-x86_64
          if [ -n "${{ steps.shas.outputs.darwin_x86_64 }}" ]; then
            sed -i "/darwin-x86_64/,/sha256/{s|# sha256 \".*\"|sha256 \"${{ steps.shas.outputs.darwin_x86_64 }}\"|; s|sha256 \".*\"|sha256 \"${{ steps.shas.outputs.darwin_x86_64 }}\"|}" "$FORMULA"
          fi
          # linux-x86_64
          if [ -n "${{ steps.shas.outputs.linux_x86_64 }}" ]; then
            sed -i "/linux-x86_64/,/sha256/{s|# sha256 \".*\"|sha256 \"${{ steps.shas.outputs.linux_x86_64 }}\"|; s|sha256 \".*\"|sha256 \"${{ steps.shas.outputs.linux_x86_64 }}\"|}" "$FORMULA"
          fi
          # linux-aarch64
          if [ -n "${{ steps.shas.outputs.linux_aarch64 }}" ]; then
            sed -i "/linux-aarch64/,/sha256/{s|# sha256 \".*\"|sha256 \"${{ steps.shas.outputs.linux_aarch64 }}\"|; s|sha256 \".*\"|sha256 \"${{ steps.shas.outputs.linux_aarch64 }}\"|}" "$FORMULA"
          fi

          cat "$FORMULA"

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update sulcus-local to ${GITHUB_REF#refs/tags/}"
          git push
