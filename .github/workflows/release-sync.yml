name: Release Sync Extension

on:
  push:
    tags:
      - "sync-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. sync-v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15
            asset: libsulcus_sync-darwin-x86_64
            lib_name: libsulcus_sync.dylib
          - target: aarch64-apple-darwin
            os: macos-15
            asset: libsulcus_sync-darwin-arm64
            lib_name: libsulcus_sync.dylib
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset: libsulcus_sync-linux-x86_64
            lib_name: libsulcus_sync.so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            asset: libsulcus_sync-linux-aarch64
            lib_name: libsulcus_sync.so
            cross: true

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.asset }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: "!matrix.cross"
        run: |
          cargo build --release --target ${{ matrix.target }} -p sulcus-sync
        env:
          ORT_STRATEGY: download

      - name: Build (cross)
        if: matrix.cross
        run: |
          cross build --release --target ${{ matrix.target }} -p sulcus-sync --features vendored-openssl
        env:
          ORT_STRATEGY: download

      - name: Package library
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.lib_name }} staging/
          cd staging
          tar czf ../${{ matrix.asset }}.tar.gz ${{ matrix.lib_name }}
          cd ..
          shasum -a 256 ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256

  release:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release-files/ \;
          echo "## SHA256 Checksums" > release-files/CHECKSUMS.md
          echo '```' >> release-files/CHECKSUMS.md
          cat release-files/*.sha256 >> release-files/CHECKSUMS.md
          echo '```' >> release-files/CHECKSUMS.md
          ls -la release-files/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets..."
            gh release upload "$TAG" release-files/*.tar.gz release-files/*.sha256 --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "sulcus-sync $TAG" \
              --notes-file release-files/CHECKSUMS.md \
              release-files/*.tar.gz release-files/*.sha256
          fi
