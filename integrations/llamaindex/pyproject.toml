[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sulcus-llamaindex"
version = "0.1.0"
description = "LlamaIndex storage integration for Sulcus thermodynamic memory"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Digital Forge Studios", email = "contact@dforge.ca" }]
keywords = ["sulcus", "llamaindex", "llm", "memory", "rag", "vector-store"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"

dependencies = [
  "sulcus>=0.1.0",
  "llama-index-core>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-mock",
  "ruff",
]

[project.urls]
Homepage = "https://sulcus.ca"
Repository = "https://github.com/dforge/sulcus"
Documentation = "https://docs.sulcus.ca"

[tool.hatch.build.targets.wheel]
packages = ["sulcus_llamaindex"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
