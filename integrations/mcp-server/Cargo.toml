[package]
name = "sulcus-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for Sulcus — Thermodynamic Memory for AI Agents"
license = "MIT"
authors = ["Digital Forge Studios <contact@sulcus.ca>"]
repository = "https://github.com/digitalforgeca/sulcus"
homepage = "https://sulcus.ca"
readme = "README.md"
keywords = ["mcp", "sulcus", "memory", "ai", "agents"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "sulcus-mcp"
path = "src/main.rs"

[dependencies]
# MCP protocol
rmcp = { version = "0.16", features = ["server", "transport-io", "transport-streamable-http-server"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# HTTP client (cloud mode)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP server (for --http mode)
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"

# Error handling
anyhow = "1"
thiserror = "2"

[features]
default = ["cloud"]
cloud = ["dep:reqwest"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
