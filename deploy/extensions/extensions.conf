# extensions.conf — Nginx config for sulcus-sync extension delivery
# Deploy to: /opt/forge/services/dionysus/conf.d/extensions.conf
# Domain: extensions.technocraftonline.com (Janus/Traefik handles TLS)

server {
    listen 80;
    server_name extensions.technocraftonline.com;

    root /opt/forge/services/dionysus/sites/extensions;

    # Disable directory listing
    autoindex off;

    # Serve binary files with appropriate headers
    location / {
        # Only allow GET and HEAD
        limit_except GET HEAD {
            deny all;
        }

        # Binary content types for dylib/so files
        types {
            application/octet-stream dylib;
            application/octet-stream so;
        }
        default_type application/octet-stream;

        # Cache headers: immutable versioned releases, revalidate 'latest'
        location ~ ^/v[0-9]+\.[0-9]+\.[0-9]+/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Sulcus-Distribution "forge-vps";
        }

        location /latest/ {
            add_header Cache-Control "public, max-age=300";
            add_header X-Sulcus-Distribution "forge-vps";
        }

        # Security: no sniffing, no framing
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # CORS: allow sulcus-server to fetch from any origin
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD" always;
    }

    # Health check
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Block everything else
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }
}
