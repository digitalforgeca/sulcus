version: "3.8"

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: sulcus-postgres:latest
    environment:
      POSTGRES_USER: sulcus
      POSTGRES_PASSWORD: sulcus
      POSTGRES_DB: sulcus_test
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sulcus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
