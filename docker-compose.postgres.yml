version: "3.8"

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: sulcus-postgres:latest
    environment:
      POSTGRES_USER: sulcus
      POSTGRES_PASSWORD: sulcus
      POSTGRES_DB: sulcus_test
    ports:
      - "4201:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/0002_init-keycloak-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sulcus"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: auth.sulcus.ca
      KC_HOSTNAME_PORT: 8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
