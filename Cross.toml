[target.aarch64-unknown-linux-gnu]
# Pre-install a C compiler and perl (needed for openssl-sys vendored build).
# The cross container already has a cross-compiler, but the host build-script
# compiler sometimes isn't in PATH.
pre-build = [
    "apt-get update && apt-get install -y perl make"
]
env.passthrough = ["OPENSSL_STATIC", "OPENSSL_VENDORED", "ORT_STRATEGY"]
