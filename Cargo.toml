[workspace]
resolver = "2"
members = [
    "crates/sulcus-core",
    "crates/sulcus-vectors",
    "crates/sulcus",
    "crates/sulcus-server",
    "crates/sulcus-store",
    "crates/sulcus-sync",
    "crates/sulcus-types",
    "crates/sulcus-multimind",
    "crates/sulcus-wasm",
]
# sulcus-wasm requires `--target wasm32-unknown-unknown` and wasm-pack;
# exclude it from the default native build so `cargo check` stays green.
default-members = [
    "crates/sulcus-core",
    "crates/sulcus-vectors",
    "crates/sulcus",
    "crates/sulcus-server",
    "crates/sulcus-store",
    "crates/sulcus-sync",
    "crates/sulcus-multimind",
]

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }
axum = "0.7"
tracing = "0.1"
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }

[profile.release]
# Thin LTO is ~3x faster than fat LTO with minimal size/perf penalty.
# codegen-units = 4 allows some parallelism while keeping good optimization.
opt-level = "s"
lto = "thin"
codegen-units = 4
panic = "abort"


