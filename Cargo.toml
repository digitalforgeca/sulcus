[workspace]
resolver = "2"
members = [
    "crates/sulcus-core",
    "crates/sulcus-local",
    "crates/sulcus-server",
    "crates/sulcus-sync",
    "crates/sulcus-wasm",
]
# sulcus-wasm requires `--target wasm32-unknown-unknown` and wasm-pack;
# exclude it from the default native build so `cargo check` stays green.
default-members = [
    "crates/sulcus-core",
    "crates/sulcus-local",
    "crates/sulcus-server",
    "crates/sulcus-sync",
]

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }
axum = "0.7"
tracing = "0.1"
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }

[profile.release]
# Optimise aggressively for binary size and performance.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"


