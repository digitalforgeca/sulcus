[package]
name = "sulcus-server"
version = "0.1.0"
edition = "2021"
description = "Enterprise server (placeholder) - depends on `sulcus-core`"
publish = false

[dependencies]
sulcus-core = { path = "../sulcus-core" }
sulcus-local = { path = "../sulcus-local" }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"
dashmap = "5.5"
tracing-subscriber = "0.3"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
subtle = "2"
uuid = { workspace = true }
rand = "0.8"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
prometheus = "0.14"
once_cell = "1.17"

[features]
server-bin = []

[dev-dependencies]
tower = "0.5"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tempfile = "3.5"