[package]
name = "sulcus-server"
version = "2.14.0"
edition = "2021"
description = "Enterprise server for SULCUS - database-first agent sync server"
publish = false
license-file = "../../LICENSE-COMMERCIAL"

[dependencies]
sulcus-core = { path = "../sulcus-core" }
sulcus-types = { path = "../sulcus-types" }
sulcus = { path = "../sulcus" }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-english = "0.1"
tracing = "0.1"
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"
dashmap = "5.5"
tracing-subscriber = "0.3"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
aes-gcm = "0.10"
hkdf = "0.12"
subtle = "2"
uuid = { workspace = true }
rand = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
prometheus = "0.14"
once_cell = "1.17"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
base64 = "0.21"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
url = "2"
tower-http = { version = "0.5", features = ["cors", "limit", "set-header"] }
tower = { version = "0.5", features = ["limit"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
pgvector = { version = "0.4.1", features = ["sqlx"] }
fastembed = { version = "5", default-features = false, features = ["ort-load-dynamic", "ort-download-binaries-native-tls", "hf-hub-native-tls"] }
ort = { version = "=2.0.0-rc.11", default-features = false }
urlencoding = "2.1.3"

[features]
server-bin = []

# ── Deployment config (read by deploy.sh) ────────────────────────────────────
[package.metadata.deploy]
acr_registry = "sulcusacr"
acr_image = "sulcus-server:latest"
container_app = "sulcus-server"
resource_group = "sulcus-rg"
api_url = "https://api.sulcus.ca"
dockerfile = "docker/server/Dockerfile"

[dev-dependencies]
tempfile = "3.5"
