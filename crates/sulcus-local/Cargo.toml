[package]
name = "sulcus-local"
version = "0.1.0"
edition = "2021"
description = "Local sidecar and vMMU engine for SULCUS"
publish = false
license-file = "../../LICENSE-COMMERCIAL"

[dependencies]
sulcus-core = { path = "../sulcus-core" }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "macros", "postgres", "uuid", "chrono"] }
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.7", features = ["v4", "v5", "v7", "serde"] }
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
rand = "0.8"
prometheus = "0.14"
hyper = { version = "0.14", features = ["full"] }
once_cell = "1.17"
tempfile = { version = "3.5", optional = true }
fastembed = { version = "5", default-features = false, features = ["ort-load-dynamic", "ort-download-binaries-native-tls", "hf-hub-native-tls", "image-models"] }
# Keep dynamic loading (avoids macOS bindgen/ABI issues) and also download/copy
# ONNX Runtime binaries so `libonnxruntime.dylib` is present at runtime.
ort = { version = "2.0.0-rc.11", default-features = false, features = ["load-dynamic", "download-binaries", "copy-dylibs", "tls-native"] }
bytemuck = "1.16"
tiktoken-rs = "0.6"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tokio-stream = "0.1"
futures = "0.3"
dashmap = "5"
# Zero-copy buffer access from sulcus-core + file-backed mmap
memmap2 = "0.9"
rkyv = { version = "0.7", features = ["std", "validation"] }
# base64 for fold binary export (vector repr)
base64 = "0.21"
# hex for tombstone address formatting
hex = "0.4"
pg-embed = { version = "1.0.0", default-features = false, features = ["rt_tokio"] }
hnsw_rs = "0.3.0"
libloading = "0.8"

[dev-dependencies]
tempfile = "3.5"
