[package]
name = "sulcus-local"
version = "0.1.0"
edition = "2021"
description = "Local sidecar and vMMU engine for SULCUS"
publish = false
license-file = "../../LICENSE-COMMERCIAL"

[dependencies]
sulcus-core = { path = "../sulcus-core" }
# ── Kept: lightweight runtime deps ────────────────────────────────────
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.7", features = ["v4", "v5", "v7", "serde"] }
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
rand = "0.8"
prometheus = "0.14"
hyper = { version = "0.14", features = ["full"] }
once_cell = "1.17"
tempfile = { version = "3.5", optional = true }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tokio-stream = "0.1"
futures = "0.3"
dashmap = "5"
bytemuck = "1.16"
memmap2 = "0.9"
rkyv = { version = "0.7", features = ["std", "validation"] }
base64 = "0.21"
hex = "0.4"
hnsw_rs = "0.3.0"
# ── Dynamic loading (for embed/store/sync dylibs) ────────────────────
libloading = "0.8"
# ── Crypto (for plugin download/decrypt — lightweight) ────────────────
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

# ── REMOVED: now in separate dylibs ──────────────────────────────────
# fastembed   → sulcus-embed dylib
# ort         → sulcus-embed dylib
# tiktoken-rs → sulcus-embed dylib
# pg-embed    → sulcus-store dylib
# sqlx        → sulcus-store dylib (BUT still needed for runtime.rs migrations)

# SQLx is still needed for migrations and direct queries in runtime.rs/storage.rs.
# This is the NEXT step to remove — refactor storage.rs to call through the
# sulcus-store dylib's C ABI. For now, keep it to avoid breaking the MCP server.
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "macros", "postgres", "uuid", "chrono"] }
pg-embed = { version = "1.0.0", default-features = false, features = ["rt_tokio"] }

# Vendored OpenSSL for cross-compilation
openssl = { version = "0.10", features = ["vendored"], optional = true }

[features]
default = []
vendored-openssl = ["openssl"]

[dev-dependencies]
tempfile = "3.5"
