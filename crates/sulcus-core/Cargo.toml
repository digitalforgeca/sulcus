[package]
name = "sulcus-core"
version = "1.0.0"
edition = "2021"
description = "Core memory model and thermodynamics for SULCUS — a federated knowledge network with ACT-R thermodynamics and HLC-CRDTs"
license-file = "../../LICENSE-COMMERCIAL"
publish = false
repository = "https://github.com/digitalforgeca/sulcus"
homepage = "https://sulcus.ca"
documentation = "https://docs.rs/sulcus-core"
keywords = ["memory", "knowledge-graph", "crdt", "thermodynamics", "agent"]
categories = ["data-structures", "database", "algorithms"]
readme = "README.md"

[dependencies]
sulcus-types = { path = "../sulcus-types" }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.7", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
# Zero-copy shared memory (rkyv archive) — compiles on all targets including wasm32
rkyv = { version = "0.7", features = ["std", "validation"] }

# mmap is OS-only; not available on wasm32-unknown-unknown
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
tempfile = "3.5"
