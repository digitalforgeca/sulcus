[package]
name = "sulcus-embed"
version = "0.1.0"
edition = "2021"
description = "Embedding engine dylib for SULCUS — fastembed + ONNX Runtime"
license-file = "../../LICENSE-COMMERCIAL"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fastembed = { version = "5", default-features = false, features = ["ort-load-dynamic", "ort-download-binaries-native-tls", "hf-hub-native-tls", "image-models"] }
ort = { version = "2.0.0-rc.11", default-features = false, features = ["load-dynamic", "download-binaries", "copy-dylibs", "tls-native"] }
tiktoken-rs = "0.6"
anyhow = "1.0"
tracing = "0.1"
once_cell = "1.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
