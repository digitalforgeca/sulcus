[package]
name = "sulcus-multimind"
version = "0.1.0"
edition = "2021"
description = "Generic ONNX model registry — inference, signals, retrain. Used by Sulcus SIU and Guardian."

[dependencies]
anyhow = "1.0"
ort = { version = "2.0.0-rc.11", features = ["load-dynamic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
