# Standalone crate — excluded from the parent workspace intentionally.
# sulcus-siu has heavy ONNX deps that would affect workspace build times.
[workspace]

[package]
name = "sulcus-siu"
version = "1.0.0"
edition = "2021"
description = "Semantic Intelligence Unit — classifies memory types and decomposes text into atomic fragments"
license-file = "../../LICENSE-COMMERCIAL"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "download-binaries", "copy-dylibs", "tls-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
once_cell = "1.17"
