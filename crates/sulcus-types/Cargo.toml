[package]
name = "sulcus-types"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Public types for Sulcus — reactive, thermodynamic memory engine for AI agents"
authors = ["Digital Forge Studios <contact@sulcus.ca>"]
repository = "https://github.com/digitalforgeca/sulcus"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
memmap2 = "0.9"
rkyv = { version = "0.7", features = ["std", "validation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3.5"
