[package]
name = "sulcus"
description = "Sulcus — Thermodynamic Memory for AI Agents. One binary, everything integral."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["sulcus", "memory", "ai", "agents", "mcp"]
categories = ["command-line-utilities"]

[[bin]]
name = "sulcus"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/sulcus-{ target }{ archive-suffix }"
bin-dir = "sulcus-{ target }/sulcus{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
default = ["cloud"]
cloud = ["dep:sulcus-cloud", "dep:sulcus-mcp-impl", "dep:rmcp", "dep:hyper", "dep:hyper-util", "dep:tower-service"]
local = []  # placeholder for Phase 4 — embedded SQLite + local embeddings

[dependencies]
sulcus-core = { workspace = true }
sulcus-cloud = { workspace = true, optional = true }
sulcus-mcp-impl = { workspace = true, optional = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rmcp = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
