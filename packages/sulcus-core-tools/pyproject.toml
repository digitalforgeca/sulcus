[project]
name = "sulcus-core-tools"
version = "1.0.0"
description = "Canonical Sulcus tool definitions and handlers for all integrations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Digital Forge Studios", email = "contact@sulcus.ca"},
]
keywords = ["sulcus", "memory", "ai", "tools", "openai", "anthropic", "gemini"]

[project.urls]
Homepage = "https://sulcus.ca"
Repository = "https://github.com/digitalforgeca/sulcus"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
